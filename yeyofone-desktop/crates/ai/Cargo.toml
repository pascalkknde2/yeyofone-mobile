[package]
name = "yeyofone-ai"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
[features]
default = []
# Local speech-to-text with whisper.cpp; enabled by the app's native build only, so plain
# `cargo test` stays fast and needs no C++ toolchain.
whisper = ["dep:whisper-rs"]
[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.145"
whisper-rs = { version = "=0.16.0", optional = true }
[lints]
workspace = true
