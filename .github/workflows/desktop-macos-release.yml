name: Desktop macOS release

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            label: aarch64
          - runner: macos-15-intel
            arch: x86_64
            label: x64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: yeyofone-desktop
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup show

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            yeyofone-desktop/target
          key: cargo-${{ matrix.arch }}-${{ hashFiles('yeyofone-desktop/Cargo.lock') }}

      - name: Build pinned PJSIP/OpenSSL stack
        run: |
          python3 -m venv .native-tools
          .native-tools/bin/pip install cmake==4.1.2
          python3 scripts/build-native.py --arch ${{ matrix.arch }} --cmake "$PWD/.native-tools/bin/cmake"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
        working-directory: yeyofone-desktop/frontend

      - name: Build Tauri app and DMG
        env:
          # "-" = ad-hoc signing. Replace with a Developer ID identity (plus the
          # APPLE_* notarization secrets) once a paid Apple account exists.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Unset secrets arrive as empty strings, which makes Tauri try to import an empty certificate.
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -z "${!v}" ] && unset "$v"
          done
          bun run tauri build --features native-voip --bundles app,dmg

      - name: Rename artifact
        run: |
          mkdir -p dist-release
          cp target/release/bundle/dmg/*.dmg "dist-release/YeyoFone-macos-${{ matrix.label }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: YeyoFone-macos-${{ matrix.label }}
          path: yeyofone-desktop/dist-release/*.dmg

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: yeyofone-desktop/dist-release/*.dmg
          generate_release_notes: true
